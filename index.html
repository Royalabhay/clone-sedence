<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clone-sedence</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #5c6b82;
        --accent: #4f46e5;
        --accent-strong: #3730a3;
        --border: #dbe3ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body.dark {
        --bg: #101624;
        --card: #172033;
        --text: #f6f8fb;
        --muted: #b6c2d4;
        --accent: #8b5cf6;
        --accent-strong: #a78bfa;
        --border: #2f3b52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 32rem), var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 760px);
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(23, 32, 51, 0.14);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.75rem);
        line-height: 0.95;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.65;
      }

      .actions,
      .status-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
      }

      button,
      code {
        border-radius: 999px;
      }

      button {
        border: 0;
        padding: 0.85rem 1.1rem;
        cursor: pointer;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-strong);
        outline: 3px solid rgba(79, 70, 229, 0.24);
      }

      code,
      .status-card {
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }

      code {
        display: inline-flex;
        margin-top: 0.5rem;
        padding: 0.35rem 0.7rem;
        color: var(--text);
        white-space: nowrap;
      }

      .status-grid {
        margin-top: 1.5rem;
      }

      .status-card {
        flex: 1 1 190px;
        padding: 1rem;
        border-radius: 1rem;
      }

      .status-card strong {
        display: block;
        margin-bottom: 0.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Browser-ready static app</p>
      <h1>clone-sedence</h1>
      <p>
        This page confirms the repository can now be opened in a browser without installing dependencies.
        Start a local static server, then visit <code>http://127.0.0.1:4173</code>.
      </p>

      <div class="actions" aria-label="Demo controls">
        <button id="theme-toggle" type="button">Toggle theme</button>
        <button id="copy-command" class="secondary" type="button">Copy run command</button>
      </div>

      <section class="status-grid" aria-label="Runtime status">
        <article class="status-card">
          <strong>Server URL</strong>
          <span id="server-url">Loading...</span>
        </article>
        <article class="status-card">
          <strong>Local time</strong>
          <span id="local-time">Loading...</span>
        </article>
        <article class="status-card">
          <strong>Run command</strong>
          <span>./start-local.sh</span>
        </article>
      </section>
    </main>

    <script>
      const body = document.body;
      const themeToggle = document.querySelector('#theme-toggle');
      const copyCommand = document.querySelector('#copy-command');
      const serverUrl = document.querySelector('#server-url');
      const localTime = document.querySelector('#local-time');
      const runCommand = './start-local.sh';

      const savedTheme = localStorage.getItem('clone-sedence-theme');
      if (savedTheme === 'dark') {
        body.classList.add('dark');
      }

      serverUrl.textContent = window.location.href;

      const updateTime = () => {
        localTime.textContent = new Intl.DateTimeFormat(undefined, {
          dateStyle: 'medium',
          timeStyle: 'medium'
        }).format(new Date());
      };

      updateTime();
      setInterval(updateTime, 1000);

      themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        localStorage.setItem('clone-sedence-theme', body.classList.contains('dark') ? 'dark' : 'light');
      });

      copyCommand.addEventListener('click', async () => {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(runCommand);
          copyCommand.textContent = 'Copied!';
        } else {
          copyCommand.textContent = runCommand;
        }

        setTimeout(() => {
          copyCommand.textContent = 'Copy run command';
        }, 1400);
      });
    </script>
  </body>
</html>
